name: ci

on:
  push:
    # only pushes to main trigger
    branches: [main]
  pull_request:
    # always triggered

jobs:

  test:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
        - aiida-core-version: 2.8.0
          aiida-qe-version: 5.0.0
        - aiida-core-version: 2.9.2
          aiida-qe-version: 5.1.0

    steps:
    - uses: actions/checkout@v4

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install Python package and dependencies
      run: pip install -e .[dev] aiida-core==${{ matrix.aiida-core-version }} aiida-quantumespresso==${{ matrix.aiida-qe-version }}

    - name: Run pre-commit
      run: pre-commit run --all-files || ( git status --short ; git diff ; exit 1 )

    - name: Run tests
      run: pytest -q -m 'not integration'
